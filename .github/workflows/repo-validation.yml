name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  maintenance:
    name: Repo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject post-G5 producer changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            python mechanics/release-support/parts/release-gate-routing/scripts/validate_routing_maintenance_only.py --base-ref "$BASE_REF"
          else
            python mechanics/release-support/parts/release-gate-routing/scripts/validate_routing_maintenance_only.py
          fi

      - name: Run maintenance gate
        run: python scripts/release_check.py
